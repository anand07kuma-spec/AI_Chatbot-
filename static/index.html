<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Astra AI | Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=__VER__" />
</head>
<body>

<div id="overlay" class="overlay"></div>

<div id="ctxMenu" class="ctx-menu" style="display:none">
  <button id="ctxDelete" class="ctx-item">🗑 Delete chat</button>
</div>

<aside id="sidebar" class="sidebar">
  <div class="side-top">
    <div class="logo">✦ Astra AI</div>
    <button id="newChatBtn" class="new-chat-btn" aria-label="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
  </div>

  <div class="side-label">Recent</div>
  <nav id="chatList" class="chat-list"></nav>
  <div class="side-hint">Right-click a chat to delete</div>

  <div class="side-bottom">
    <button id="exportBtn" class="side-action" aria-label="Export chat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export chat
    </button>
  </div>
</aside>

<div class="shell">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-title">
      Astra AI
    </div>
  </header>

  <main id="scrollArea" class="scroll-area">
    <div id="emptyState" class="empty-state">
      <div class="greet">How can I help you today?</div>
      <div class="suggestions">
        <button class="sugg" data-prompt="Explain Python in simple words with an example"><b>🐍 Learn Python</b><span>Explain Python in simple words with an example</span></button>
        <button class="sugg" data-prompt="What is Artificial Intelligence? Give a simple analogy"><b>🧠 Explore AI</b><span>What is Artificial Intelligence? Give a simple analogy</span></button>
        <button class="sugg" data-prompt="Write a clean responsive HTML landing page for a startup"><b>💻 Build a webpage</b><span>Write a clean responsive HTML landing page</span></button>
        <button class="sugg" data-prompt="Tell me 5 fun facts about space"><b>✨ Discover something</b><span>Tell me 5 fun facts about space</span></button>
      </div>
    </div>
    <div id="messages" class="messages"></div>
  </main>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Astra AI..." spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Message input"></textarea>
      <button id="micBtn" class="mic-btn" title="Speak your message" aria-label="Speak your message">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button id="sendBtn" class="send-btn" title="Send" aria-label="Send message">
        <svg id="sendIcon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.4-1.2 1.1L4.5 11c.1.4.5.7.9.7l7.6.8-7.6.8c-.4 0-.8.3-.9.7l-2.3 6.3c-.2.7.5 1.4 1.2 1.1z"/></svg>
        <svg id="stopIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
      </button>
    </div>
    <div class="disclaimer">Astra AI can make mistakes. Check important info.</div>
  </footer>
</div>

<script src="/static/app.js?v=__VER__"></script>
</body>
</html>
